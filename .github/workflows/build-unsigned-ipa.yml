name: Build Unsigned IPA

on:
  push:
    branches:
      - scan-from-main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Verify scanner parity with original main
        run: python3 tests/verify_scanner.py
      - name: Build unsigned IPA
        run: |
          chmod +x ./build-ipa.sh
          ./build-ipa.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-original-scanner-unsigned
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
