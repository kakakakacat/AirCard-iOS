name: Build Unsigned IPA

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify scanner-only bilingual release
        run: python3 tests/verify_scanner_only_release.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Test scanner timeout, cancellation and stream errors
        run: cargo test --manifest-path tests/scan-diagnostics/Cargo.toml
      - name: Rebuild Rust FFI with scanner diagnostics
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          bash ./build-ios.sh
          strings AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a > /tmp/aircard-ffi-strings.txt
          grep -q 'scan-diag-v1' /tmp/aircard-ffi-strings.txt
      - name: Build unsigned IPA
        run: |
          chmod +x ./build-ipa.sh
          ./build-ipa.sh Release
          mkdir -p release
          cp build/AirCard-iOS.ipa release/AirCard-Hash-Scanner.ipa
          shasum -a 256 release/AirCard-Hash-Scanner.ipa > release/AirCard-Hash-Scanner.ipa.sha256
      - name: Save IPA in release directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/AirCard-Hash-Scanner.ipa release/AirCard-Hash-Scanner.ipa.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Add hash scanner IPA [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-Hash-Scanner-unsigned
          path: release/AirCard-Hash-Scanner.ipa
          if-no-files-found: error
