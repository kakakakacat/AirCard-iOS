name: Build Unsigned IPA

on:
  push:
    branches:
      - scan-from-main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify scanner parity with original main
        run: python3 tests/verify_scanner.py
      - name: Verify macOS Wallet flash parity
        run: python3 tests/verify_card_flash.py
      - name: Verify AirTraffic reads restore source files
        run: python3 tests/verify_read_restore.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Test scanner timeout, cancellation and stream errors
        run: cargo test --manifest-path tests/scan-diagnostics/Cargo.toml
      - name: Rebuild Rust FFI with scanner diagnostics
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          bash ./build-ios.sh
          strings AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a > /tmp/aircard-ffi-strings.txt
          grep -q 'scan-diag-v1' /tmp/aircard-ffi-strings.txt
      - name: Build unsigned IPA
        run: |
          chmod +x ./build-ipa.sh
          ./build-ipa.sh Release
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-wallet-db-v1-unsigned
          path: build/AirCard-iOS.ipa
          if-no-files-found: error
